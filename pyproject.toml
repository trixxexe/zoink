[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoink"
version = "0.3.0"
description = "ZoinK — Fast Termux & Linux Music Downloader + Modern AMOLED Web Player"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ZoinK Contributors"}
]
keywords = ["music", "downloader", "tui", "web-player", "termux", "audio", "spotify-ui", "id3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47.0",
    "flask>=3.0",
    "requests>=2.28",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
zoink = "zoink.cli:main"

[tool.setuptools.packages.find]
include = ["zoink*"]

[tool.setuptools.package-data]
"zoink.web" = ["static/*"]
