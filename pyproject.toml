[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoink"
version = "0.1.0"
description = "ZoinK — TUI Song Downloader + Web Music Player"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47.0",
    "flask>=3.0",
    "requests>=2.28",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
zoink = "zoink.cli:main"

[tool.setuptools.packages.find]
include = ["zoink*"]
